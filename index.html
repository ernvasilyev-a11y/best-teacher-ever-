<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Марина Валеріївна</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff1f3;
  --text:#5b1230;
  --heart:#e11d48;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1d0a12;--text:#ffe4ea;--heart:#fb7185}
}
:root[data-theme="dark"]{--bg:#1d0a12;--text:#ffe4ea;--heart:#fb7185}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:"Playfair Display",Georgia,"Times New Roman",serif;
  padding:0 24px;
  box-sizing:border-box;
}
h1{
  margin:0;
  font-weight:600;
  font-size:clamp(2rem,8vw,4.5rem);
  line-height:1.25;
  max-width:14em;
}
.heart{
  display:inline-block;
  color:var(--heart);
  animation:beat 1.4s ease-in-out infinite;
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.25)}
  30%{transform:scale(1)}
  45%{transform:scale(1.18)}
}
@media (prefers-reduced-motion:reduce){.heart{animation:none}}
</style>
</head>
<body>
<h1>Марина Валеріївна,<br>ви найкраща вчителька<br>з англійської мови <span class="heart" aria-hidden="true">❤️</span></h1>
</body>
</html>
